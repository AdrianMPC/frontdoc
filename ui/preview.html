<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>frontdocs preview</title>
    <style>
      body { margin: 0; padding: 1rem; }
      #root { display: flex; flex-wrap: wrap; gap: 1.5rem; align-items: flex-start; }
      figure { margin: 0; display: grid; gap: 0.5rem; justify-items: start; }
      .error { color: #b00020; background: #fdecee; border: 1px solid #f5c2c7; border-radius: 6px; padding: 0.75rem; font: 13px system-ui, sans-serif; max-width: 100%; }
      .error pre { white-space: pre-wrap; margin: 0.5rem 0; }
      figcaption { font: 12px system-ui, sans-serif; color: #666; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./preview.tsx"></script>
  </body>
</html>
